name: Machine Learning CI Pipeline
# Trigger this workflow on any git push to the main branch
on:
  push:
    branches: [ main ]

jobs:
  # JOB 1: Enforce Code Style and Find Structural Bugs
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.10

    # This single line handles everything cleanly without system flags!
    - name: Run Code Formatter Check
      run: uvx black --check src/
  
  # JOB 2: Run TensorFlow Unit Tests (Continuous Testing)
  run-unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.10

    # FIX: We create and activate a proper virtual environment inside the runner workspace
    - name: Install Dependencies & Package
      run: |
        uv venv
        echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
        uv pip install -r requirements-dev.txt
        uv pip install -e .

    - name: Run Test Suite
      run: pytest

  # JOB 3: Automated Container Delivery (CD)
  build-and-delivery:
    runs-on: ubuntu-latest
    needs: [run-unit-tests, lint-and-format] # Only runs if linting AND tests pass!
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    #Log in to your personal DockerHub warehouse using security secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      
    # Compiles and pushes the fresh production image live to the cloud registry
    - name: Build and Push Production Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: t4cause/churn-api:latest

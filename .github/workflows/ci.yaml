name: Machine Learning CI Pipeline
# Trigger this workflow on any git push to the main branch
on:
  push:
    branches: [ main ]

jobs:
  # JOB 1: Enforce Code Style and Find Structural Bugs
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.10

    - name: Install Linting Tools
      run: uv pip install black flake8 --system

    - name: Run Code Formatter Check
      run: black --check src/
  
  # JOB 2: Run TensorFlow Unit Tests (Continuous Testing)
  run-unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.10

    - name: Install Dependencies & Package
      run: |
        uv pip install --system -r requirements-dev.txt
        uv pip install --system -e .

    - name: Run Test Suite
      run: pytest

  # JOB 3: Automated Container Delivery (CD)
  build-and-delivery:
    runs-on: ubuntu-latest
    needs: [run-unit-tests, lint-and-format] # Only runs if linting AND tests pass!
    